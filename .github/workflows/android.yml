name: Android build

on:
  push:
    paths:
      - "apps/android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :apps:android:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vantage-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
